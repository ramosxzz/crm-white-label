name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      WHATSAPP_WEBHOOK_VERIFY_TOKEN: placeholder
      INSTAGRAM_WEBHOOK_VERIFY_TOKEN: placeholder
      CRON_SECRET: placeholder
      NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci

      # O Dockerfile instala so com package.json + package-lock.json: nao copia
      # .npmrc nem nada do repo. Se algum arquivo de config mudar a resolucao
      # aqui e nao la, o lock passa neste job e o build do container quebra com
      # "Missing: <pacote> from lock file" - foi o que derrubou o deploy em
      # 2026-07-29. Este passo instala do jeito que o Docker instala.
      - name: Validar package-lock como o Docker instala
        run: |
          rm -rf /tmp/lockcheck && mkdir -p /tmp/lockcheck
          cp package.json package-lock.json /tmp/lockcheck/
          cd /tmp/lockcheck
          npm ci --omit=dev --dry-run

      - run: npm run build

      - run: npm test

      - run: npm run check:migrations

      # Falha o build so em vulnerabilidade critica (ja temos 3 "high" hoje,
      # herdadas do proprio Next.js/sharp, que so fecham com upgrade major -
      # travar nisso agora so trava todo deploy sem ninguem poder mergear).
      - name: Audit de dependencias (critico bloqueia, alto so avisa)
        run: |
          npm audit --audit-level=critical
          npm audit --audit-level=high || echo "::warning::npm audit encontrou vulnerabilidades 'high' - ver 'npm audit' localmente."

  deploy:
    needs: build-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set target service by branch
        id: target
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "service=app" >> "$GITHUB_OUTPUT"
            echo "healthcheck_container=solaire-crm" >> "$GITHUB_OUTPUT"
          else
            echo "service=app-staging" >> "$GITHUB_OUTPUT"
            echo "healthcheck_container=solaire-crm-staging" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          for i in 1 2 3 4 5; do
            ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts && break
            echo "ssh-keyscan falhou (tentativa $i), tentando de novo..."
            sleep 5
          done

      - name: Sync code to VPS
        run: |
          # A conexao SSH pro VPS as vezes cai no meio da transferencia (visto
          # no VPS: "Connection closed by <ip-do-runner>", sem fail2ban, sem
          # bloqueio de firewall na porta 22, carga/memoria normais - e
          # instabilidade transitoria de rede entre o runner do GitHub e o
          # VPS, nao algo do lado do servidor). 3 tentativas de 20s ja
          # falharam seguidas uma vez (2026-09-09); agora sao 5 com backoff
          # maior, e --partial pra nao perder o progresso ja transferido a
          # cada retry.
          for i in 1 2 3 4 5; do
            rsync -az --partial --delete --filter=':- .gitignore' --exclude '.git' --exclude '.env*' --exclude 'supabase/.temp' \
              -e "ssh -i ~/.ssh/deploy_key -o ConnectTimeout=30 -o ServerAliveInterval=15" \
              ./ "${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_HOST }}:/opt/solaire-crm/app-src/" && exit 0
            echo "rsync falhou (tentativa $i/5), tentando de novo em $((i * 15))s..."
            sleep $((i * 15))
          done
          echo "rsync falhou nas 5 tentativas."
          exit 1

      - name: Build and restart container (production)
        if: steps.target.outputs.service == 'app'
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_HOST }}" \
            "cd /opt/solaire-crm/app-src && docker compose -f docker-compose.vps.yml --env-file .env.production up -d --build app"

      - name: Build and restart container (staging)
        if: steps.target.outputs.service == 'app-staging'
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_HOST }}" \
            "cd /opt/solaire-crm/app-src && set -a && . ./.env.staging && export STAGING_NEXT_PUBLIC_APP_URL=\$NEXT_PUBLIC_APP_URL STAGING_NEXT_PUBLIC_SUPABASE_URL=\$NEXT_PUBLIC_SUPABASE_URL STAGING_NEXT_PUBLIC_SUPABASE_ANON_KEY=\$NEXT_PUBLIC_SUPABASE_ANON_KEY && docker compose -f docker-compose.vps.yml --env-file .env.production up -d --build app-staging"

      - name: Health check
        run: |
          # Container "Started" nao significa Next.js ja aceitando conexao -
          # o bind da porta leva alguns segundos. Um wget so, sem espera,
          # falhava com "connection refused" mesmo com o deploy correto
          # (aconteceu 2x em 2026-09-08). Tenta por ate 60s antes de desistir.
          ssh -i ~/.ssh/deploy_key "${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_HOST }}" \
            'for i in $(seq 1 12); do
              docker exec n8n-caddy-1 wget -qO- http://${{ steps.target.outputs.service }}:3000/api/health && exit 0
              echo "health check falhou (tentativa $i/12), esperando 5s..."
              sleep 5
            done
            echo "health check nao respondeu apos 60s"
            exit 1'
