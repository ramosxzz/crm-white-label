services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_META_APP_ID: ${NEXT_PUBLIC_META_APP_ID}
        NEXT_PUBLIC_META_WHATSAPP_CONFIG_ID: ${NEXT_PUBLIC_META_WHATSAPP_CONFIG_ID}
    container_name: solaire-crm
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - default
      - n8n_default

  app-staging:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${STAGING_NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_SUPABASE_URL: ${STAGING_NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${STAGING_NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_META_APP_ID: ${NEXT_PUBLIC_META_APP_ID}
        NEXT_PUBLIC_META_WHATSAPP_CONFIG_ID: ${NEXT_PUBLIC_META_WHATSAPP_CONFIG_ID}
    container_name: solaire-crm-staging
    restart: unless-stopped
    env_file:
      - .env.staging
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    ports:
      - "127.0.0.1:3001:3000"
    networks:
      - default
      - n8n_default

networks:
  n8n_default:
    external: true
